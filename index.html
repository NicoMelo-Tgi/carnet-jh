<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070A">
<title>Credenciales JH 2026</title>
<meta property="og:title" content="Carnet Hernandiano · Club José Hernández">
<meta property="og:description" content="Credenciales de acceso · Liga Metropolitana 2026">
<meta property="og:image" content="https://nicomelo-tgi.github.io/carnet-jh/img-ferri.png">
<meta name="twitter:card" content="summary_large_image">
<style>
  :root{--bg:#05070A;--panel:#10151B;--line:#222A34;--celeste:#7FBCEA;
        --hueso:#EEF3F7;--mudo:#7A8792;--oro:#E9B912}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--hueso);
       font-family:Archivo,-apple-system,"Segoe UI",Roboto,sans-serif}
  .visor{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:15px;padding:20px 16px 30px}
  .carnet{width:100%;max-width:420px;perspective:1500px;cursor:pointer}
  .caras{position:relative;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.4,.1,.2,1)}
  .carnet.dado .caras{transform:rotateY(180deg)}
  .cara{backface-visibility:hidden;-webkit-backface-visibility:hidden}
  .cara.b{position:absolute;inset:0;transform:rotateY(180deg)}
  .cara svg{width:100%;height:auto;display:block;border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.6)}
  .pista{font-size:12.5px;color:var(--mudo)}
  .benef{font-size:13.5px;font-weight:600;text-decoration:none;color:var(--oro);
    border:1px solid rgba(233,185,18,.45);border-radius:99px;padding:10px 20px}
  .benef:hover{background:rgba(233,185,18,.12)}

  .panel{max-width:940px;margin:0 auto;padding:24px 16px 70px}
  .caja{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:20px}
  h1{font-size:19px;margin:0 0 6px}
  h2{font-size:15px;margin:0 0 4px}
  p{margin:0 0 12px;font-size:13.5px;line-height:1.6;color:var(--mudo)}
  label.campo{display:block;font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--mudo);font-weight:700;margin:0 0 6px}
  input[type=text],select{font:inherit;font-size:13.5px;width:100%;padding:10px 12px;border-radius:7px;
    border:1px solid #2E3843;background:#0C1116;color:var(--hueso)}
  input::placeholder{color:#54606B}
  .fila2{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
  .fila2>div{flex:1;min-width:170px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--mudo);
     padding:0 8px 9px 0;border-bottom:1px solid var(--line);font-weight:700}
  td{padding:9px 8px 9px 0;border-bottom:1px solid #1A212A;vertical-align:middle}
  td.n{font-family:Consolas,Menlo,monospace;color:var(--celeste);font-weight:700;width:44px}
  button{font:inherit;font-size:12.5px;font-weight:600;border-radius:7px;padding:9px 14px;cursor:pointer;
    border:1px solid #2E3843;background:#1A212A;color:var(--hueso);white-space:nowrap}
  button.pri{background:var(--celeste);color:#08131F;border-color:var(--celeste)}
  button.pri:hover{background:#9ACDF2}
  button.ok{background:#2C5E3F;border-color:#2C5E3F;color:#DFF3E6}
  :focus-visible{outline:2px solid var(--celeste);outline-offset:3px}
  .aviso{margin:12px 0 0;padding:11px 13px;border-left:3px solid var(--oro);background:#1F1F19;
    font-size:12.5px;line-height:1.6;color:#D6D1C2}
  .salida{margin-top:12px;padding:11px 13px;background:#0C1116;border:1px solid var(--line);
    border-radius:8px;font-family:Consolas,Menlo,monospace;font-size:12px;color:var(--celeste);
    word-break:break-all;display:none}
  @media (prefers-reduced-motion:reduce){.caras{transition:none}}

  .overlay{position:fixed;inset:0;background:rgba(3,5,8,.86);z-index:50;display:flex;
    flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px 16px}
  .overlay .carnet{max-width:360px}
  .overlay .fila{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}

  /* planilla de puerta */
  .hoja{background:#fff;color:#111;max-width:1000px;margin:0 auto;padding:26px}
  .hoja h1{color:#111;font-size:20px;margin:0 0 2px}
  .hoja p{color:#555}
  .hoja table{font-size:12px}
  .hoja th,.hoja td{border:1px solid #999;padding:6px;text-align:center;color:#111}
  .hoja th:first-child,.hoja td:first-child{text-align:left;white-space:nowrap}
  .noimp{margin:0 auto 14px;max-width:1000px}
  @media print{.noimp{display:none}body{background:#fff}.hoja{padding:0}}
</style>
</head>
<body>
<div id="app"></div>

const ABC = "ACDEFHJKLMNPRTUVWXY349";
function codigo(sem){
  let h = 2166136261;
  for (let i = 0; i < sem.length; i++){ h ^= sem.charCodeAt(i); h = Math.imul(h, 16777619); }
  let s = "", x = Math.abs(h);
  for (let k = 0; k < 5; k++){ s += ABC[x % ABC.length]; x = Math.floor(x / ABC.length); }
  return "JH26-" + s;
}

function qrRows(txt){
  const q = qrcode(0, "M");
  q.addData(txt); q.make();
  const n = q.getModuleCount(), out = [];
  for (let r = 0; r < n; r++){ let s = ""; for (let c = 0; c < n; c++) s += q.isDark(r,c) ? "1" : "0"; out.push(s); }
  return out;
}
function qrPath(rows, x, y, size){
  const n = rows.length, u = size / n; let d = "";
  for (let r = 0; r < n; r++){ let c = 0;
    while (c < n){
      if (rows[r][c] === "1"){ let e = c; while (e+1 < n && rows[r][e+1] === "1") e++;
        d += `M${(x+c*u).toFixed(2)} ${(y+r*u).toFixed(2)}h${((e-c+1)*u).toFixed(2)}v${u.toFixed(2)}h-${((e-c+1)*u).toFixed(2)}z`;
        c = e+1; } else c++; }}
  return `<rect x="${x-14}" y="${y-14}" width="${size+28}" height="${size+28}" rx="8" fill="#FFFFFF"/><path d="${d}" fill="#05070A"/>`;
}

function credDe(par){
  const t = par.get("t");
  if (t === "PF"){
    const j = JUG[+par.get("j")];
    if (!j) return null;
    return {t:"PF", sup:j.nom, titular:j.ape, big:j.num, ghost:j.num,
            detalle:"Pase familiar · 11 fechas de local",
            cod:codigo("PF|" + j.ape + "|" + j.num)};
  }
  if (t === "DIR"){
    const n = par.get("n") || "Sin titular";
    const r = par.get("r") || "";
    const par2 = n.trim().split(/\s+/);
    const ape2 = par2.length > 1 ? par2.slice(1).join(" ") : n;
    return {t:"DIR", sup:par2[0], titular:ape2, big:"JH", ghost:"JH",
            detalle:(r ? r + " · " : "") + "Club José Hernández",
            cod:codigo("DIR|" + n)};
  }
  if (TIPOS[t]){
    const n = par.get("n") || "Sin titular";
    const det = t === "SOC"
      ? "Comunidad Hernandiana · Beneficios en comercios"
      : TIPOS[t].nom + " · 11 fechas de local";
    return {t:t, sup:"Socio", titular:n, big:"26", ghost:"26",
            detalle:det, cod:codigo(t + "|" + n)};
  }
  return null;
}

function bajarPNG(markup, nombre){
  const url = URL.createObjectURL(new Blob([markup], {type:"image/svg+xml;charset=utf-8"}));
  const img = new Image();
  img.onload = function(){
    const c = document.createElement("canvas");
    c.width = W; c.height = H;
    c.getContext("2d").drawImage(img, 0, 0);
    URL.revokeObjectURL(url);
    c.toBlob(function(b){
      const a = document.createElement("a");
      a.href = URL.createObjectURL(b); a.download = nombre; a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1500);
    }, "image/png");
  };
  img.src = url;
}

function verCarnet(cr){
  const nom = cr.titular.normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^A-Za-z0-9]+/g,"_");
  const o = document.createElement("div");
  o.className = "overlay";
  o.innerHTML = '<div class="carnet" id="mc"><div class="caras">' +
    '<div class="cara a">' + frente(cr) + '</div><div class="cara b">' + dorso(cr) + '</div>' +
    '</div></div><p class="pista">Tocá el carnet para darlo vuelta</p>' +
    '<a class="benef" href="beneficios.html" target="_blank" rel="noopener">Beneficios en comercios del barrio</a>' +
    '<div class="fila"><button class="pri" id="mf">Descargar frente</button>' +
    '<button id="md">Descargar dorso</button><button id="mx">Cerrar</button></div>';
  document.body.appendChild(o);
  const mc = o.querySelector("#mc");
  mc.addEventListener("click", () => mc.classList.toggle("dado"));
  o.querySelector("#mf").addEventListener("click", () => bajarPNG(frente(cr), "Carnet_" + nom + "_frente.png"));
  o.querySelector("#md").addEventListener("click", () => bajarPNG(dorso(cr), "Carnet_" + nom + "_dorso.png"));
  o.querySelector("#mx").addEventListener("click", () => o.remove());
  o.addEventListener("click", e => { if (e.target === o) o.remove(); });
}

      if (roles[i].trim()) q += "&r=" + encodeURIComponent(roles[i].trim());
      const cr = credDe(new URLSearchParams(q));
      cr.url = raiz() + slugify(DIR[i].n) + ".html";
      verCarnet(cr);
    });
  });
  function dirNuevo(){
    const n = document.getElementById("dnom").value.trim();
    if (!n){ document.getElementById("dnom").focus(); return null; }
    const r = document.getElementById("drol").value.trim();
    return "t=DIR&n=" + encodeURIComponent(n) + (r ? "&r=" + encodeURIComponent(r) : "");
  }
  document.getElementById("verdir").addEventListener("click", function(){
    const q = dirNuevo(); if (!q) return;
    const cr = credDe(new URLSearchParams(q));
    cr.url = raiz() + "?" + q;
    verCarnet(cr);
  });
  document.getElementById("emidir").addEventListener("click", function(){
    const q = dirNuevo(); if (!q) return;
    const url = raiz() + "?" + q;
    const sd = document.getElementById("saldir");
    sd.style.display = "block"; sd.textContent = url;
    copiar(url, this);
  });
  function socCred(){
    const n = document.getElementById("soc").value.trim();
    if (!n){ document.getElementById("soc").focus(); return null; }
    return n;
  }
  document.getElementById("versoc").addEventListener("click", function(){
    const n = socCred(); if (!n) return;
    const cr = credDe(new URLSearchParams("t=SOC&n=" + encodeURIComponent(n)));
    cr.url = raiz() + "?t=SOC&n=" + encodeURIComponent(n);
    verCarnet(cr);
  });
  document.getElementById("emisoc").addEventListener("click", function(){
    const n = socCred(); if (!n) return;
    const url = raiz() + "?t=SOC&n=" + encodeURIComponent(n);
    const sa = document.getElementById("salsoc");
    sa.style.display = "block"; sa.textContent = url;
    copiar(url, this);
  });
  document.getElementById("verab").addEventListener("click", function(){
    const n = document.getElementById("tit").value.trim();
    const t = document.getElementById("tipo").value;
    if (!n){ document.getElementById("tit").focus(); return; }
    const cr = credDe(new URLSearchParams("t=" + t + "&n=" + encodeURIComponent(n)));
    cr.url = raiz() + "?t=" + t + "&n=" + encodeURIComponent(n);
    verCarnet(cr);
  });
  document.getElementById("emitir").addEventListener("click", function(){
    const n = document.getElementById("tit").value.trim();
    const t = document.getElementById("tipo").value;
    if (!n){ document.getElementById("tit").focus(); return; }
    const url = raiz() + "?t=" + t + "&n=" + encodeURIComponent(n);
    const s = document.getElementById("salida");
    s.style.display = "block";
    s.textContent = url;
    copiar(url, this);
  });
}
</script>
